name: CI/CD Pipeline

on:
  push:
    branches:
      - '*'

env:
  DOCKER_USER: ${{ secrets.DOCKER_USER }}
  DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

jobs:

  #################################
  # 1. TEST BACKEND
  #################################
  test-backend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build and test backend
        run: |
          cd Backend
          chmod +x ./mvnw
          ./mvnw clean test

  #################################
  # 2. TEST FRONTEND
  #################################
  test-frontend:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd Frontend
          npm install --legacy-peer-deps

      - name: Verify frontend build
        run: |
          cd Frontend
          npm run build

      - name: Run frontend tests
        run: |
          cd Frontend
          npm run test -- --watch=false --browsers=ChromeHeadless

  #################################
  # 3. BUILD & PUSH DOCKER IMAGES
  #################################
  build-and-push:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: ./Backend
          push: true
          tags: molka2709/backend:latest

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./Frontend
          push: true
          tags: molka2709/frontend:latest

  #################################
  # 4. SCAN VULNERABILITES
  #################################
  scan-vulnerabilities:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: molka2709/backend:latest
        continue-on-error: true

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: molka2709/frontend:latest
        continue-on-error: true

  #################################
  # 5. UPLOAD BUILD ARTEFACTS
  #################################
  upload-artifacts:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4

      - name: Build backend war
        run: |
          cd Backend
          chmod +x ./mvnw
          ./mvnw clean package -DskipTests

      - name: Upload backend war
        uses: actions/upload-artifact@v4
        with:
          name: backend-war
          path: Backend/target/*.war

      - name: Build frontend dist
        run: |
          cd Frontend
          npm install --legacy-peer-deps
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: Frontend/dist/**

  #################################
  # 6. NOTIFY EMAIL
  #################################
  notify-email:
    runs-on: ubuntu-latest
    needs: [upload-artifacts, scan-vulnerabilities]
    if: always()
    steps:
      - name: Send email notification
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 587
          username: ${{ secrets.EMAIL_USER }}
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "✅ Pipeline terminé - GestionUser"
          body: |
            Bonjour,

            Le pipeline CI/CD est terminé.

            ✅ Repository: ${{ github.repository }}
            🔁 Commit: ${{ github.sha }}
            📦 Branche: ${{ github.ref_name }}

            Les images Docker ont été construites et poussées avec succès.
            Les artefacts ont été archivés.
            Le scan des vulnérabilités est effectué.

            --
            Ceci est un email automatique.
          to: molkajridi2003@gmail.com
          from: "GitHub Actions"
