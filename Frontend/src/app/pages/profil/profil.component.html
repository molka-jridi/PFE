<div class="d-flex justify-content-center align-items-center w-100 bg-light" style="min-height: calc(100vh - 70px); padding-top: 20px;">
  <div class="card shadow border-0 rounded-4 p-4" style="max-width: 600px; width: 100%;">
    
    <!-- Avatar + Titre -->
    <div class="text-center mb-4">
      <div class="rounded-circle bg-primary d-inline-flex justify-content-center align-items-center" style="width: 90px; height: 90px;">
        <i class="fas fa-user-circle fa-3x text-white"></i>
      </div>
      <h4 class="mt-3 text-primary">Profil utilisateur</h4>
    </div>

    <!-- Infos -->
    <div class="mb-3 d-flex align-items-center">
      <i class="fas fa-id-badge text-secondary me-3 fa-lg"></i>
      <div><strong>Prénom :</strong> {{ firstname }}</div>
    </div>

    <div class="mb-3 d-flex align-items-center">
      <i class="fas fa-id-card text-secondary me-3 fa-lg"></i>
      <div><strong>Nom :</strong> {{ lastname }}</div>
    </div>

    <div class="mb-3 d-flex align-items-center">
      <i class="fas fa-envelope text-secondary me-3 fa-lg"></i>
      <div><strong>Email :</strong> {{ email }}</div>
    </div>

    <div class="d-flex align-items-start">
      <i class="fas fa-user-shield text-secondary me-3 fa-lg mt-1"></i>
      <div>
        <strong>Rôles :</strong><br />
        <span class="badge bg-gradient bg-success px-3 py-1 me-1" *ngFor="let role of roles">{{ role }}</span>
      </div>
    </div>
  </div>
</div>
